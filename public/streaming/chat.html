<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #334155;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #374151;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #dc2626;
            --success: #059669;
            --warning: #eab308;
            --border: #1e293b;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            margin: 0 auto;
            background: var(--surface);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--surface);
            border-bottom: 1px solid var(--secondary);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(30, 41, 59, 0.95);
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-header h1 i {
            color: var(--primary);
            font-size: 1.125rem;
        }

        .back-button {
            padding: 0.5rem;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 0.75rem;
            background: var(--surface-light);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .back-button:hover {
            background: var(--primary);
            color: var(--text);
            transform: translateY(-1px);
        }

        .back-button i {
            font-size: 1rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: var(--background);
        }

        .chat-message {
            padding: 1rem 1.25rem;
            background: var(--surface);
            border-radius: 1rem;
            max-width: 75%;
            position: relative;
            margin: 0.25rem 0;
            align-self: flex-start;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .chat-message:hover {
            transform: translateY(-1px);
        }

        .chat-message.local-message {
            background: var(--primary);
            align-self: flex-end;
            color: white;
        }

        .message-header {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin-bottom: 0.5rem;
        }

        .message-sender {
            font-weight: 600;
            color: var(--text);
            font-size: 0.875rem;
        }

        .message-time {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            opacity: 0.8;
        }

        .message-content {
            word-wrap: break-word;
            line-height: 1.5;
            color: var(--text);
            font-size: 0.9375rem;
        }

        .local-message .message-sender,
        .local-message .message-time,
        .local-message .message-content {
            color: white;
        }

        .chat-input-container {
            padding: 1.25rem;
            background: var(--surface);
            border-top: 1px solid var(--secondary);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 0.75rem;
            max-width: 768px;
            margin: 0 auto;
            background: var(--surface-light);
            padding: 0.75rem;
            border-radius: 1rem;
            transition: all 0.2s ease;
        }

        .chat-input-wrapper:focus-within {
            box-shadow: 0 0 0 2px var(--primary);
            background: var(--surface);
        }

        #chatInput {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        #chatInput::placeholder {
            color: var(--text-secondary);
        }

        #sendMessageBtn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 1.25rem;
        }

        #sendMessageBtn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        #sendMessageBtn:active {
            transform: translateY(0);
        }

        .online-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--success);
            padding: 0.5rem 1rem;
            background: var(--surface-light);
            border-radius: 2rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .online-indicator:hover {
            background: var(--success);
            color: var(--text);
        }

        .online-indicator:hover .online-dot {
            background: white;
        }

        .online-indicator:hover .online-dot::after {
            background: white;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            position: relative;
            transition: all 0.2s ease;
        }

        .online-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
            opacity: 0.5;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 0.5;
            }
        }

        /* Custom scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--surface);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--surface-light);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Message animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-message {
            animation: slideIn 0.3s ease forwards;
        }

        @media (min-width: 768px) {
            .chat-container {
                max-width: 768px;
                margin: 0 auto;
                border-left: 1px solid var(--secondary);
                border-right: 1px solid var(--secondary);
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-header-left">
                <button class="back-button" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h1>
                    <i class="fas fa-comments"></i>
                    <span>Class Chat</span>
                </h1>
            </div>
            <div class="online-indicator">
                <div class="online-dot"></div>
                <span>Connected</span>
            </div>
        </div>

        <div id="chatMessages" class="chat-messages"></div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button id="sendMessageBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Get room parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || '';
        const userName = urlParams.get('userName') || '';
        const sessionId = urlParams.get('sessionId') || '';

        function goBack() {
            // Instead of navigating, just close this window
            window.close();
        }

        // Handle window close event
        window.addEventListener('beforeunload', () => {
            // If opener exists and is accessible, update the chat tab state
            if (window.opener && !window.opener.closed) {
                const chatTab = window.opener.document.querySelector('.tab-btn[data-tab="chat"]');
                if (chatTab) {
                    chatTab.classList.remove('active');
                }
            }
        });

        // Initialize Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC6gdAOUcIA9w_KuCYXse6aCfZjqLYU71s",
            authDomain: "moroccan-platform-streaming.firebaseapp.com",
            projectId: "moroccan-platform-streaming",
            databaseURL: "https://moroccan-platform-streaming-default-rtdb.firebaseio.com",
            storageBucket: "moroccan-platform-streaming.firebasestorage.app",
            messagingSenderId: "785334032082",
            appId: "1:785334032082:web:07ed141b102ba995417f0b",
            measurementId: "G-K4YKPL8DBS"
        };

        // Initialize Firebase
        let database;
        let chatRef;
        let currentUser;

        async function initializeFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                chatRef = database.ref(`rooms/${roomName}/chat`);
                
                // Load existing messages
                chatRef.limitToLast(100).on('child_added', (snapshot) => {
                    const message = snapshot.val();
                    appendMessage(message);
                });

                // Setup message input
                document.getElementById('sendMessageBtn').addEventListener('click', sendMessage);
                document.getElementById('chatInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });

                return true;
            } catch (error) {
                console.error('Firebase initialization error:', error);
                return false;
            }
        }

        function appendMessage(message) {
            const messagesEl = document.getElementById('chatMessages');
            const isLocal = message.senderId === currentUser.sessionId;
            
            const messageEl = document.createElement('div');
            messageEl.className = `chat-message ${isLocal ? 'local-message' : ''}`;
            messageEl.innerHTML = `
                <div class="message-header">
                    <span class="message-sender">${message.senderName}</span>
                    <span class="message-time">${new Date(message.timestamp).toLocaleTimeString()}</span>
                </div>
                <div class="message-content">${escapeHtml(message.text)}</div>
            `;

            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            
            if (!text) return;

            try {
                await chatRef.push({
                    text,
                    senderId: currentUser.sessionId,
                    senderName: currentUser.name,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            } catch (error) {
                console.error('Failed to send message:', error);
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            // Try to get user info from URL parameters first
            const urlParams = new URLSearchParams(window.location.search);
            const roomName = urlParams.get('room');
            const userName = urlParams.get('userName');
            const sessionId = urlParams.get('sessionId');

            // Try to get stored user info if URL params are missing
            let storedInfo = null;
            try {
                storedInfo = JSON.parse(sessionStorage.getItem('chatUserInfo'));
            } catch (e) {
                console.error('Failed to parse stored user info:', e);
            }

            // Set current user with priority: URL params > stored info > anonymous
            currentUser = {
                sessionId: sessionId || storedInfo?.sessionId || 'anonymous-' + Math.random().toString(36).substr(2, 9),
                name: userName || storedInfo?.name || 'Anonymous'
            };

            // Validate room name
            if (!roomName && storedInfo?.room) {
                window.location.href = `chat.html?room=${encodeURIComponent(storedInfo.room)}&userName=${encodeURIComponent(currentUser.name)}&sessionId=${encodeURIComponent(currentUser.sessionId)}`;
                return;
            } else if (!roomName) {
                console.error('No room name provided');
                window.close(); // Close window instead of redirecting
                return;
            }

            // Update page title with user name
            document.title = `Chat - ${currentUser.name}`;

            // Store the current user info
            const userInfo = {
                ...currentUser,
                room: roomName
            };
            sessionStorage.setItem('chatUserInfo', JSON.stringify(userInfo));

            // Initialize Firebase and start chat
            const initialized = await initializeFirebase();
            if (!initialized) {
                console.error('Failed to initialize Firebase');
                return;
            }

            // Update online indicator
            document.querySelector('.online-indicator span').textContent = `Connected as ${currentUser.name}`;

            // Focus the chat input
            document.getElementById('chatInput').focus();
        });
    </script>

    <!-- Add Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
</body>
</html>
