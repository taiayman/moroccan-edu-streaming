<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student's Virtual Classroom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #334155;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #374151;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #dc2626;
            --success: #059669;
            --warning: #eab308;
        }

        /* Hide Daily.co's default UI elements */
        .jsx-4039607251,
        .jsx-89ec28b0d67cac58.topbar,
        [class*="daily-"],
        [class*="robots-btn-"],
        [class*="daily-prejoin-"],
        [class*="daily-video-"],
        [class*="daily-media-"],
        [class*="daily-menu-"],
        [class*="daily-name-"],
        [class*="daily-info-"],
        [class*="daily-pip-"],
        [class*="daily-notification-"],
        [class*="daily-screenshare-"],
        [class*="daily-chat-"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Hide any Daily.co branding */
        a[href*="daily.co"],
        div[class*="daily-"],
        div[class*="topbar"],
        div[class*="view-switch"],
        div[class*="settings"],
        div[class*="prejoin"],
        div[class*="name-tag"],
        div[class*="menu-"],
        div[class*="pip-"],
        div[class*="notification-"],
        div[class*="screenshare-"],
        div[class*="chat-"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Ensure our custom UI is on top */
        .controls-container,
        .status-badge,
        .sidebar {
            z-index: 9999 !important;
        }

        /* Hide any remaining Daily.co elements */
        iframe[allow*="daily.co"] {
            border: none !important;
        }

        /* Keep only the video stream */
        #mainVideo {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            border-radius: 0.5rem !important;
        }

        /* Ensure video container takes full space */
        #videoContainer {
            position: relative !important;
            width: 100% !important;
            height: 100% !important;
            background-color: var(--surface) !important;
            border-radius: 0.5rem !important;
            margin: 0 !important;
            overflow: hidden !important;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .classroom-container {
            display: grid;
            grid-template-rows: 1fr auto;
            height: 100vh;
            background-color: var(--background);
        }

        .controls-container {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 1rem 2rem;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            gap: 1rem;
            z-index: 10;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: none;
            background: var(--secondary);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.2rem;
        }

        .control-btn:hover {
            background: var(--surface-light);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: var(--primary);
            color: white;
        }

        .control-btn.leave {
            background: var(--danger);
        }

        .control-btn.leave:hover {
            background: #b91c1c;
        }

        .control-btn.hand {
            background: var(--success);
        }

        .control-btn.hand.active {
            background: var(--warning);
            animation: pulse 2s infinite;
        }

        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 320px;
            height: 100vh;
            background: var(--surface);
            padding: 1.5rem;
            color: var(--text);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--secondary);
        }

        .sidebar-header h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .sidebar-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tab-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            background: var(--surface-light);
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding-right: 0.5rem;
            height: calc(100% - 60px); /* Adjust for header height */
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        #chatContainer.overlay {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 320px;
            background: var(--surface);
            border-left: 1px solid var(--secondary);
            z-index: 1000;
            box-shadow: -4px 0 6px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }

        #participantsList.tab-content {
            padding-bottom: 1rem;
        }

        #chatContainer.tab-content {
            display: none;
            flex-direction: column;
            height: calc(100% - 60px); /* Adjust for header height */
        }

        #chatContainer.tab-content.active {
            display: flex;
        }
/* Chat styles */
.chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--secondary);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    background: rgba(30, 41, 59, 0.95);
}

.chat-header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.chat-header h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.chat-header h1 i {
    color: var(--primary);
    font-size: 1.125rem;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    background: var(--background);
}

.chat-message {
    padding: 1rem 1.25rem;
    background: var(--surface);
    border-radius: 1rem;
    max-width: 75%;
    position: relative;
    margin: 0.25rem 0;
    align-self: flex-start;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    transition: transform 0.2s ease;
    animation: slideIn 0.3s ease forwards;
}

.chat-message:hover {
    transform: translateY(-1px);
}

.chat-message.local-message {
    background: var(--primary);
    align-self: flex-end;
    color: white;
}

.message-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
    font-size: 0.875rem;
}

.message-sender {
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.25rem;
}

.message-time {
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 500;
}

.message-content {
    word-wrap: break-word;
    line-height: 1.5;
    color: var(--text);
    font-size: 0.9375rem;
}

.local-message .message-sender,
.local-message .message-time,
.local-message .message-content {
    color: white;
}

.chat-input-container {
    padding: 1.25rem;
    background: var(--surface);
    border-top: 1px solid var(--secondary);
}

.chat-input-wrapper {
    display: flex;
    gap: 0.75rem;
    max-width: 768px;
    margin: 0 auto;
    background: var(--surface-light);
    padding: 0.75rem;
    border-radius: 1rem;
    transition: all 0.2s ease;
}

.chat-input-wrapper:focus-within {
    box-shadow: 0 0 0 2px var(--primary);
    background: var(--surface);
}

#chatInput {
    flex: 1;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 1rem;
    outline: none;
}

#chatInput::placeholder {
    color: var(--text-secondary);
}

#sendMessageBtn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: none;
    background: var(--primary);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    font-size: 1.25rem;
}

#sendMessageBtn:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
}

/* Online indicator */
.online-indicator {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.875rem;
    color: var(--success);
    padding: 0.5rem 1rem;
    background: var(--surface-light);
    border-radius: 2rem;
    font-weight: 500;
    transition: all 0.2s ease;
}

.online-indicator:hover {
    background: var(--success);
    color: var(--text);
}

.online-dot {
    width: 8px;
    height: 8px;
    background: var(--success);
    border-radius: 50%;
    position: relative;
    transition: all 0.2s ease;
}

.online-dot::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: var(--success);
    border-radius: 50%;
    animation: pulse 2s infinite;
    opacity: 0.5;
}

/* Message animations */
@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

        .toggle-sidebar {

        .toggle-sidebar:hover {

        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #streamError {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--danger);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            z-index: 50;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

<body>
    <div class="classroom-container">
        <div id="videoContainer">
            <div id="mainVideo"></div>
        </div>

        <button class="toggle-sidebar" onclick="toggleSidebar()">
            <i class="fas fa-users"></i>
        </button>

        <div class="controls-container">
            <button class="control-btn" id="videoBtn" title="Toggle Video">
                <i class="fas fa-video"></i>
            </button>
            <button class="control-btn disabled" id="micStatus" title="Microphone Disabled" disabled>
                <i class="fas fa-microphone-slash"></i>
            </button>
            <button class="control-btn hand" id="handBtn" title="Raise Hand">
                <i class="fas fa-hand"></i>
            </button>
            <button class="control-btn leave" id="leaveBtn" title="Leave Class">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>

        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-tabs">
                    <button class="tab-btn active" data-tab="participants">Participants</button>
                    <button class="tab-btn" data-tab="chat">Chat</button>
                </div>
                <button class="control-btn" onclick="toggleSidebar()" style="width: 40px; height: 40px;">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Participants List -->
            <div id="participantsList" class="tab-content active" data-tab="participants"></div>

            <!-- Chat Container -->
            <div id="chatContainer" class="tab-content" data-tab="chat">
                <div class="chat-header">
                    <div class="chat-header-left">
                        <h1>
                            <i class="fas fa-comments"></i>
                            <span>Class Chat</span>
                        </h1>
                    </div>
                    <div class="online-indicator">
                        <div class="online-dot"></div>
                        <span>Connected</span>
                    </div>
                </div>
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <input type="text" id="chatInput" placeholder="Type a message...">
                        <button id="sendMessageBtn" class="control-btn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Firebase configuration and room parameters globally
        window.FIREBASE_CONFIG = {
            apiKey: "AIzaSyC6gdAOUcIA9w_KuCYXse6aCfZjqLYU71s",
            authDomain: "moroccan-platform-streaming.firebaseapp.com",
            projectId: "moroccan-platform-streaming",
            databaseURL: "https://moroccan-platform-streaming-default-rtdb.firebaseio.com",
            storageBucket: "moroccan-platform-streaming.firebasestorage.app",
            messagingSenderId: "785334032082",
            appId: "1:785334032082:web:07ed141b102ba995417f0b",
            measurementId: "G-K4YKPL8DBS"
        };

        window.DAILY_PARAMS = {
            ROOM_NAME: new URLSearchParams(window.location.search).get('room') || ''
        };

        // Sidebar toggle functionality
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                sidebar.classList.toggle('open');
            }
        }

        // Update sidebar toggle visibility based on screen size
        function updateSidebarToggle() {
            const toggleBtn = document.querySelector('.toggle-sidebar');
            if (toggleBtn) {
                if (window.innerWidth <= 768) {
                    toggleBtn.style.display = 'flex';
                } else {
                    toggleBtn.style.display = 'none';
                }
            }
        }

        // Function to initialize and show chat overlay
        async function navigateToChat() {
            if (!window.callFrame) {
                console.error('Daily.co frame not initialized');
                return;
            }

            const participants = window.callFrame.participants();
            const localParticipant = participants?.local;
            
            if (!localParticipant) {
                console.error('Local participant information not available');
                return;
            }

            const roomName = window.DAILY_PARAMS.ROOM_NAME;
            const userName = localParticipant.user_name || 'Anonymous';
            const sessionId = localParticipant.session_id;

            // Store user info
            window.currentUser = {
                sessionId: sessionId,
                name: userName,
                room: roomName
            };
            sessionStorage.setItem('chatUserInfo', JSON.stringify(window.currentUser));

            // Open chat in a new window with specific dimensions
            const chatURL = `chat.html?room=${encodeURIComponent(roomName)}&userName=${encodeURIComponent(userName)}&sessionId=${encodeURIComponent(sessionId)}`;
            const chatWindow = window.open(chatURL, 'ClassChat', 
                'width=400,height=600,right=0,top=0,location=no,menubar=no,toolbar=no,status=no,scrollbars=yes,resizable=yes'
            );

            // Keep track of the chat window
            window.chatWindow = chatWindow;

            // Update the chat tab state
            const chatTab = document.querySelector('.tab-btn[data-tab="chat"]');
            if (chatTab) {
                chatTab.classList.add('active');
            }

            // Add window close event listener
            chatWindow.addEventListener('beforeunload', () => {
                chatTab.classList.remove('active');
            });
        }

        function appendMessage(message) {
            if (!message) return;
            
            const messagesEl = document.getElementById('chatMessages');
            const isLocal = message.senderId === window.currentUser?.sessionId;
            
            const messageEl = document.createElement('div');
            messageEl.className = `chat-message ${isLocal ? 'local-message' : ''}`;
            messageEl.innerHTML = `
                <div class="message-header">
                    <span class="message-sender">${message.senderName}</span>
                    <span class="message-time">${new Date(message.timestamp).toLocaleTimeString()}</span>
                </div>
                <div class="message-content">${escapeHtml(message.text)}</div>
            `;

            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            
            if (!text || !window.chatRef || !window.currentUser) return;

            try {
                await window.chatRef.push({
                    text,
                    senderId: window.currentUser.sessionId,
                    senderName: window.currentUser.name,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
                input.focus();
            } catch (error) {
                console.error('Failed to send message:', error);
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initialize sidebar functionality
        document.addEventListener('DOMContentLoaded', () => {
            updateSidebarToggle();
            window.addEventListener('resize', updateSidebarToggle);

            // Update tab switching functionality
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabName = btn.getAttribute('data-tab');
                    
                    if (tabName === 'chat') {
                        // If chat window exists and not closed, focus it
                        if (window.chatWindow && !window.chatWindow.closed) {
                            window.chatWindow.focus();
                        } else {
                            navigateToChat();
                        }
                        return;
                    }

                    // Handle other tabs normally
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    document.querySelector(`.tab-content[data-tab="${tabName}"]`).classList.add('active');
                });
            });
        });
    </script>

    <script src="https://unpkg.com/@daily-co/daily-js"></script>

    <script type="module" src="js/student.js"></script>
</body>
