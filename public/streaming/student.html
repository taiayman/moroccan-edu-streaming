<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student's Virtual Classroom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #334155;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #374151;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #dc2626;
            --success: #059669;
            --warning: #eab308;
        }

        /* Hide Daily.co's default UI elements */
        .jsx-4039607251,
        .jsx-89ec28b0d67cac58.topbar,
        [class*="daily-"],
        [class*="robots-btn-"],
        [class*="daily-prejoin-"],
        [class*="daily-video-"],
        [class*="daily-media-"],
        [class*="daily-menu-"],
        [class*="daily-name-"],
        [class*="daily-info-"],
        [class*="daily-pip-"],
        [class*="daily-notification-"],
        [class*="daily-screenshare-"],
        [class*="daily-chat-"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Hide any Daily.co branding */
        a[href*="daily.co"],
        div[class*="daily-"],
        div[class*="topbar"],
        div[class*="view-switch"],
        div[class*="settings"],
        div[class*="prejoin"],
        div[class*="name-tag"],
        div[class*="menu-"],
        div[class*="pip-"],
        div[class*="notification-"],
        div[class*="screenshare-"],
        div[class*="chat-"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Ensure our custom UI is on top */
        .controls-container,
        .status-badge,
        .sidebar {
            z-index: 9999 !important;
        }

        /* Hide any remaining Daily.co elements */
        iframe[allow*="daily.co"] {
            border: none !important;
        }

        /* Keep only the video stream */
        #mainVideo {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            border-radius: 0.5rem !important;
        }

        /* Ensure video container takes full space */
        #videoContainer {
            position: relative !important;
            width: 100% !important;
            height: 100% !important;
            background-color: var(--surface) !important;
            border-radius: 0.5rem !important;
            margin: 0 !important;
            overflow: hidden !important;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
        }

        .classroom-container {
            display: grid;
            grid-template-rows: 1fr auto;
            height: 100vh;
            background-color: var(--background);
        }

        .controls-container {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 1rem 2rem;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            gap: 1rem;
            z-index: 10;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: none;
            background: var(--secondary);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.2rem;
        }

        .control-btn:hover {
            background: var(--surface-light);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: var(--primary);
            color: white;
        }

        .control-btn.leave {
            background: var(--danger);
        }

        .control-btn.leave:hover {
            background: #b91c1c;
        }

        .control-btn.hand {
            background: var(--success);
        }

        .control-btn.hand.active {
            background: var(--warning);
            animation: pulse 2s infinite;
        }

        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 320px;
            height: 100vh;
            background: var(--surface);
            padding: 1.5rem;
            color: var(--text);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--secondary);
        }

        .sidebar-header h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        #participantsList {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-right: 0.5rem;
        }

        #participantsList::-webkit-scrollbar {
            width: 6px;
        }

        #participantsList::-webkit-scrollbar-track {
            background: var(--surface);
            border-radius: 3px;
        }

        #participantsList::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 3px;
        }

        .participant-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: var(--surface-light);
            border-radius: 0.75rem;
            transition: all 0.2s;
        }

        .participant-card:hover {
            background: var(--secondary);
        }

        .participant-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .participant-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.75rem;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .participant-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .participant-controls i {
            font-size: 1rem;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-badge {
            position: fixed;
            top: 1rem;
            left: 1rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .status-badge.connected {
            background: var(--success);
            color: white;
        }

        .status-badge i {
            font-size: 0.875rem;
        }

        .toggle-sidebar {
            position: fixed;
            right: 1rem;
            top: 4rem;
            z-index: 30;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: none;
            background: var(--secondary);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.2rem;
        }

        .toggle-sidebar:hover {
            background: var(--surface-light);
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #streamError {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--danger);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            z-index: 50;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .classroom-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            #videoContainer {
                border-radius: 0 !important;
                margin: 0 !important;
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .controls-container {
                right: 0;
                left: 0;
                transform: none;
                border-radius: 0;
                padding: 2rem;
                position: fixed;
                bottom: 0;
                background: rgba(15, 23, 42, 0.95);
            }

            #toggleScreenShareBtn {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="classroom-container">
        <div id="videoContainer">
            <div id="mainVideo"></div>
        </div>

        <button class="toggle-sidebar" onclick="toggleSidebar()">
            <i class="fas fa-users"></i>
        </button>

        <div class="controls-container">
            <button id="toggleAudioBtn" class="control-btn" title="Toggle Microphone">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="toggleVideoBtn" class="control-btn" title="Toggle Camera">
                <i class="fas fa-video"></i>
            </button>
            <button id="toggleScreenShareBtn" class="control-btn" title="Share Screen">
                <i class="fas fa-desktop"></i>
            </button>
            <button id="raiseHandBtn" class="control-btn hand" title="Raise Hand">
                <i class="fas fa-hand"></i>
            </button>
            <button id="leaveBtn" class="control-btn leave" title="Leave Meeting">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>

        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>Participants</h3>
                <button class="control-btn" onclick="toggleSidebar()" style="width: 40px; height: 40px;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="participantsList"></div>
        </div>
    </div>

    <div id="streamError"></div>

    <script>
        // Initialize Firebase configuration and room parameters globally
        window.FIREBASE_CONFIG = {
            apiKey: "AIzaSyC6gdAOUcIA9w_KuCYXse6aCfZjqLYU71s",
            authDomain: "moroccan-platform-streaming.firebaseapp.com",
            projectId: "moroccan-platform-streaming",
            databaseURL: "https://moroccan-platform-streaming-default-rtdb.firebaseio.com",
            storageBucket: "moroccan-platform-streaming.firebasestorage.app",
            messagingSenderId: "785334032082",
            appId: "1:785334032082:web:07ed141b102ba995417f0b",
            measurementId: "G-K4YKPL8DBS"
        };

        window.DAILY_PARAMS = {
            ROOM_NAME: new URLSearchParams(window.location.search).get('room') || ''
        };

        // Sidebar toggle functionality
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                sidebar.classList.toggle('open');
            }
        }

        // Update sidebar toggle visibility based on screen size
        function updateSidebarToggle() {
            const toggleBtn = document.querySelector('.toggle-sidebar');
            if (toggleBtn) {
                if (window.innerWidth <= 768) {
                    toggleBtn.style.display = 'flex';
                } else {
                    toggleBtn.style.display = 'none';
                }
            }
        }

        // Initialize sidebar functionality
        document.addEventListener('DOMContentLoaded', () => {
            updateSidebarToggle();
            window.addEventListener('resize', updateSidebarToggle);
        });
    </script>

    <script src="https://unpkg.com/@daily-co/daily-js"></script>
    <!-- Add Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script type="module" src="js/student.js"></script>
</body>
</html>
